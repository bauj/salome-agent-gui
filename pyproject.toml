[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salome-agent-gui"
version = "0.2.0"
requires-python = ">=3.10"
license = {text = "LGPL-2.1-or-later"}
# mcp: salome-agent-mcp, SALOME as tools for Claude Desktop / Claude Code
dependencies = ["salome-agent", "PyQt5", "PyQt5-Qt5==5.15.19", "PyQtWebEngine==5.15.7",
                "PyQtWebEngine-Qt5==5.15.19", "mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.scripts]
salome-agent-gui = "salome_agent_gui.app:main"
salome-agent-mcp = "salome_agent_gui.mcp_server:main"

[tool.setuptools]
packages = ["salome_agent_gui"]

[tool.setuptools.package-data]
salome_agent_gui = ["config.example.json", "web/*"]
